name: novabank-workshops

networks:
  edge:
    name: novabank-edge
  capability:
    name: novabank-capability
  backend:
    name: novabank-backend
  persistence:
    name: novabank-persistence
  workflow:
    name: novabank-workflow
  demo:
    name: novabank-demo

volumes:
  novabank_api_data:
  novabank_postgres_data:
  novabank_temporal_data:

services:
  # Customer simulation with live LLM chat: docker compose --profile demo up -d --build
  # Workshop profiles also serve the UI through the API at the gateway URL.
  demo:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    image: flo-bank-demo:local
    restart: unless-stopped
    command: ["uvicorn", "src.demo.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:${DEMO_HTTP_PORT:-8000}:8000"
    environment:
      - DEMO_CHAT_MODE=${DEMO_CHAT_MODE:-live}
      - DEMO_AI_GATEWAY_URL=${DEMO_AI_GATEWAY_URL:-http://demo-gateway:9080/ai/chat/completions}
      - DEMO_AI_STATUS_URL=${DEMO_AI_STATUS_URL:-http://demo-gateway:9080/ai/status}
      - DEMO_MODEL=${LLM_MODEL:-MiniMax-M2.7}
      - DEMO_TURN_TIMEOUT_SEC=${DEMO_TURN_TIMEOUT_SEC:-45.0}
    networks:
      - demo
    depends_on:
      - demo-gateway
      - demo-inference
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    profiles: ["demo"]

  demo-gateway:
    image: apache/apisix:3.19.0-debian@sha256:9a7e45dc943fbf10ec916d1232bae4cda9302ae28a4696cfb83c2da01d261141
    restart: unless-stopped
    volumes:
      - ./docker/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./docker/apisix/apisix-demo.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    networks:
      - demo
    depends_on:
      - demo-inference
    deploy:
      resources:
        limits:
          memory: 384M
    profiles: ["demo"]

  demo-inference:
    build:
      context: .
      dockerfile: docker/adapter/Dockerfile
    image: novabank/adapter:1.0.0
    restart: unless-stopped
    environment:
      - USE_REPLAY_FIXTURES=${USE_REPLAY_FIXTURES:-false}
      - MINIMAX_API_KEY=${MINIMAX_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_PROVIDER_URL=${LLM_PROVIDER_URL:-https://api.minimax.io/v1/chat/completions}
      - LLM_MODEL=${LLM_MODEL:-MiniMax-M2.7}
      - INFERENCE_BUDGET_TOKENS=${DEMO_INFERENCE_BUDGET_TOKENS:-50000}
      - ENABLE_TELEMETRY=false
    networks:
      - demo
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 5
    profiles: ["demo"]

  apisix:
    image: apache/apisix:3.19.0-debian@sha256:9a7e45dc943fbf10ec916d1232bae4cda9302ae28a4696cfb83c2da01d261141
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APISIX_HTTP_PORT:-9080}:9080"

    volumes:
      - ./docker/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./docker/apisix/apisix-${ACTIVE_PROFILE:-w1}.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    networks:
      - edge
      - capability
      - backend
    deploy:
      resources:
        limits:
          memory: 384M
    profiles: ["w1", "w2", "w3", "w4"]

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    image: novabank/api:1.0.0
    restart: unless-stopped
    environment:
      - ENVIRONMENT=workshop
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/novabank.sqlite}
      - GATE3_API_KEY=${GATE3_API_KEY:-gate3-secret-token}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-novabank-super-secret-signing-key-for-lab}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_ISSUER=${JWT_ISSUER:-https://identity.novabank.internal/realms/novabank}
      - API_AUDIENCE=${API_AUDIENCE:-novabank-api}
      - ENABLE_TELEMETRY=${ENABLE_TELEMETRY:-true}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318/v1/traces}
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://jaeger:4318/v1/traces}
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
      - DEMO_CHAT_MODE=${DEMO_CHAT_MODE:-scripted}
      - DEMO_AI_GATEWAY_URL=${DEMO_AI_GATEWAY_URL:-http://apisix:9080/ai/chat/completions}
      - DEMO_AI_STATUS_URL=${DEMO_AI_STATUS_URL:-http://apisix:9080/ai/status}
    volumes:
      - novabank_api_data:/app/data
      - ./seed/v1_seed.json:/app/seed/v1_seed.json:ro
    networks:
      - backend
      - persistence
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 5
    profiles: ["w1", "w2", "w3", "w4"]

  adapter:
    build:
      context: .
      dockerfile: docker/adapter/Dockerfile
    image: novabank/adapter:1.0.0
    restart: unless-stopped
    environment:
      - OPA_URL=http://opa:8181/v1/data/novabank/policy
      - GATE3_URL=http://apisix:9080/api/v1
      - GATE3_API_KEY=${GATE3_API_KEY:-gate3-secret-token}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-novabank-super-secret-signing-key-for-lab}
      - MCP_AUDIENCE=${MCP_AUDIENCE:-novabank-mcp}
      - API_AUDIENCE=${API_AUDIENCE:-novabank-api}
      - USE_REPLAY_FIXTURES=${USE_REPLAY_FIXTURES:-true}
      - MINIMAX_API_KEY=${MINIMAX_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_PROVIDER_URL=${LLM_PROVIDER_URL:-https://api.minimax.io/v1/chat/completions}
      - LLM_MODEL=${LLM_MODEL:-MiniMax-M2.7}
      - INFERENCE_BUDGET_TOKENS=${INFERENCE_BUDGET_TOKENS:-100000}
      - ENABLE_TELEMETRY=${ENABLE_TELEMETRY:-true}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318/v1/traces}
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://jaeger:4318/v1/traces}
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
    networks:
      - capability
      - edge
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 5
    profiles: ["w2", "w3", "w4"]

  opa:
    image: openpolicyagent/opa:0.68.0-static@sha256:6a95ee2152d4006732916a8b63106a6e822827952234cc0e783d348ae1ead2cc
    restart: unless-stopped
    command:
      - "run"
      - "--server"
      - "--log-level=error"
      - "/policy.rego"
    volumes:
      - ./spikes/spike3_opa/policy.rego:/policy.rego:ro
    networks:
      - capability
    deploy:
      resources:
        limits:
          memory: 128M
    profiles: ["w2", "w3", "w4"]

  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-novabank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-novabank-db-pass}
      POSTGRES_DB: ${POSTGRES_DB:-novabank}
    volumes:
      - novabank_postgres_data:/var/lib/postgresql/data
    networks:
      - persistence
    deploy:
      resources:
        limits:
          memory: 384M
    profiles: ["w2", "w3", "w4"]

  jaeger:
    image: jaegertracing/all-in-one:1.57@sha256:8f165334f418ca53691ce358c19b4244226ed35c5d18408c5acf305af2065fb9
    restart: unless-stopped
    ports:
      - "127.0.0.1:${JAEGER_UI_PORT:-16686}:16686"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - backend
      - capability
      - edge
    deploy:
      resources:
        limits:
          memory: 256M
    profiles: ["w2", "w3", "w4"]

  temporal:
    build:
      context: .
      dockerfile: docker/temporal/Dockerfile
    image: novabank/temporal:1.0.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${TEMPORAL_PORT:-7233}:7233"
    environment:
      - TEMPORAL_PORT=7233
      - TEMPORAL_DB_FILE=/data/temporal.sqlite
    volumes:
      - novabank_temporal_data:/data
    networks:
      - workflow
    deploy:
      resources:
        limits:
          memory: 384M
    profiles: ["w3", "w4"]

  kafka:
    image: apache/kafka:3.7.0@sha256:41c20d65b0a2180b9deca056d47540771752e69fe9225d5748dd65a25a9675d7
    restart: unless-stopped
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://127.0.0.1:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    networks:
      - workflow
    deploy:
      resources:
        limits:
          memory: 512M
    profiles: ["w3", "w4"]

  worker:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    image: novabank/worker:1.0.0
    restart: unless-stopped
    environment:
      - TEMPORAL_HOST=temporal:7233
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - API_URL=http://apisix:9080/api/v1
      - GATE3_URL=http://apisix:9080/api/v1
      - GATE3_API_KEY=${GATE3_API_KEY:-gate3-secret-token}
      - MCP_URL=http://apisix:9080/mcp
      - AI_GATEWAY_URL=http://apisix:9080/ai/chat/completions
      - USE_REPLAY_FIXTURES=${USE_REPLAY_FIXTURES:-true}
      - LLM_MODEL=${LLM_MODEL:-MiniMax-M2.7}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-novabank-super-secret-signing-key-for-lab}
      - API_AUDIENCE=${API_AUDIENCE:-novabank-api}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
    networks:
      - workflow
      - capability
    deploy:
      resources:
        limits:
          memory: 512M
    profiles: ["w3", "w4"]

