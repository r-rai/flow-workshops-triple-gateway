name: novabank-workshops

networks:
  edge:
    name: novabank-edge
  capability:
    name: novabank-capability
  backend:
    name: novabank-backend
  persistence:
    name: novabank-persistence
  workflow:
    name: novabank-workflow

volumes:
  novabank_api_data:
  novabank_postgres_data:
  novabank_temporal_data:

services:
  apisix:
    image: apache/apisix:3.19.0-debian
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APISIX_HTTP_PORT:-9080}:9080"

    volumes:
      - ./docker/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./docker/apisix/apisix-${ACTIVE_PROFILE:-w1}.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    networks:
      - edge
      - capability
      - backend
    deploy:
      resources:
        limits:
          memory: 384M
    profiles: ["w1", "w2", "w3", "w4"]

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    image: novabank/api:1.0.0
    restart: unless-stopped
    environment:
      - ENVIRONMENT=workshop
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/novabank.sqlite}
      - GATE3_API_KEY=${GATE3_API_KEY:-gate3-secret-token}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-novabank-super-secret-signing-key-for-lab}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_ISSUER=${JWT_ISSUER:-https://identity.novabank.internal/realms/novabank}
      - API_AUDIENCE=${API_AUDIENCE:-novabank-api}
      - ENABLE_TELEMETRY=${ENABLE_TELEMETRY:-false}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318/v1/traces}
    volumes:
      - novabank_api_data:/app/data
      - ./seed/v1_seed.json:/app/seed/v1_seed.json:ro
    networks:
      - backend
      - persistence
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 5
    profiles: ["w1", "w2", "w3", "w4"]

  adapter:
    build:
      context: .
      dockerfile: docker/adapter/Dockerfile
    image: novabank/adapter:1.0.0
    restart: unless-stopped
    environment:
      - OPA_URL=http://opa:8181/v1/data/novabank/policy
      - GATE3_URL=http://apisix:9080/api/v1
      - GATE3_API_KEY=${GATE3_API_KEY:-gate3-secret-token}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-novabank-super-secret-signing-key-for-lab}
      - MCP_AUDIENCE=${MCP_AUDIENCE:-novabank-mcp}
      - API_AUDIENCE=${API_AUDIENCE:-novabank-api}
      - USE_REPLAY_FIXTURES=${USE_REPLAY_FIXTURES:-true}
    networks:
      - capability
      - edge
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 5
    profiles: ["w2", "w3", "w4"]

  opa:
    image: openpolicyagent/opa:0.68.0-static
    restart: unless-stopped
    command:
      - "run"
      - "--server"
      - "--log-level=error"
      - "/policy.rego"
    volumes:
      - ./spikes/spike3_opa/policy.rego:/policy.rego:ro
    networks:
      - capability
    deploy:
      resources:
        limits:
          memory: 128M
    profiles: ["w2", "w3", "w4"]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-novabank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-novabank-db-pass}
      POSTGRES_DB: ${POSTGRES_DB:-novabank}
    volumes:
      - novabank_postgres_data:/var/lib/postgresql/data
    networks:
      - persistence
    deploy:
      resources:
        limits:
          memory: 384M
    profiles: ["w2", "w3", "w4"]

  jaeger:
    image: jaegertracing/all-in-one:1.57
    restart: unless-stopped
    ports:
      - "127.0.0.1:${JAEGER_UI_PORT:-16686}:16686"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - backend
      - capability
      - edge
    deploy:
      resources:
        limits:
          memory: 256M
    profiles: ["w2", "w3", "w4"]

  temporal:
    build:
      context: .
      dockerfile: docker/temporal/Dockerfile
    image: novabank/temporal:1.0.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${TEMPORAL_PORT:-7233}:7233"
    environment:
      - TEMPORAL_PORT=7233
      - TEMPORAL_DB_FILE=/data/temporal.sqlite
    volumes:
      - novabank_temporal_data:/data
    networks:
      - workflow
    deploy:
      resources:
        limits:
          memory: 384M
    profiles: ["w3", "w4"]

  kafka:
    image: apache/kafka:3.7.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://127.0.0.1:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    networks:
      - workflow
    deploy:
      resources:
        limits:
          memory: 512M
    profiles: ["w3", "w4"]

  worker:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    image: novabank/worker:1.0.0
    restart: unless-stopped
    environment:
      - TEMPORAL_HOST=temporal:7233
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - API_URL=http://apisix:9080/api/v1
      - GATE3_URL=http://apisix:9080/api/v1
      - GATE3_API_KEY=${GATE3_API_KEY:-gate3-secret-token}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-novabank-super-secret-signing-key-for-lab}
      - API_AUDIENCE=${API_AUDIENCE:-novabank-api}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
    networks:
      - workflow
      - capability
    deploy:
      resources:
        limits:
          memory: 512M
    profiles: ["w3", "w4"]

