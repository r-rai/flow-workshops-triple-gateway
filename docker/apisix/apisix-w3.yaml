routes:
  # Customer simulation: isolated from Gate 3 enterprise APIs.
  - id: w3_bank_demo
    uris: ["/", "/demo-assets/*", "/demo-api/*"]
    upstream:
      type: roundrobin
      nodes:
        "api:8000": 1

  # Gate 1: AI / Replay endpoint
  - id: w3_ai_route
    uri: /ai/*
    upstream:
      type: roundrobin
      nodes:
        "adapter:8080": 1

  # Gate 2: Curated MCP Adapter endpoint
  - id: w3_mcp_route
    uri: /mcp
    upstream:
      type: roundrobin
      nodes:
        "adapter:8080": 1

  # Gate 3: API route with downstream key-auth
  - id: w3_gate3_api
    uri: /api/v1/*
    plugins:
      key-auth:
        header: X-API-Key
    upstream:
      type: roundrobin
      nodes:
        "api:8000": 1

  # OAuth RFC 8693 Token Exchange route
  - id: w3_oauth_token
    uri: /oauth/*
    upstream:
      type: roundrobin
      nodes:
        "api:8000": 1

consumers:
  - username: lab_participant
    plugins:
      key-auth:
        key: "gate3-secret-token"

#END
